[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aerolex"
version = "0.1.0"
description = "Production-grade RAG workshop over airline passenger-rights law"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas", "scikit-learn",
    "pymupdf", "pypdf", "rank-bm25",
    "sentence-transformers", "torch",
    "google-genai", "python-dotenv", "tqdm",
]

[tool.setuptools]
packages = ["aerolex"]

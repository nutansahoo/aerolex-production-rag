[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aerolex-production-rag"
version = "0.1.0"
description = "A multi-stage RAG pipeline over airline passenger-rights law."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pymupdf",
    "pypdf",
    "rank-bm25",
    "python-dotenv",
    "google-genai>=2,<3",
    "sentence-transformers",
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools]
packages = ["aerolex"]

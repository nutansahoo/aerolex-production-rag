<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title description">
  <title id="title">AeroLex evaluation: four retrieval strategies, one generation model</title>
  <desc id="description">For each of 49 questions, retrieve 20 lexical and 20 dense candidates, then fuse their rankings with RRF, keeping 20 fused candidates. Compare lexical top 10, dense top 10, RRF top 10, and a cross-encoder that reranks all 20 RRF candidates and keeps 10. Generate four independent Gemini answers and save each answer and its ordered context chunk IDs in a CSV. Later, an assistant reviewed the answers against source text using a qualitative 0 to 3 rubric; there was no separate Gemini judge API call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; fill: #4b5c73; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 17px; fill: #4b5c73; }
      .tiny { font-size: 16px; fill: #4b5c73; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 16px; fill: #4b5c73; }
      .box { fill: #ffffff; stroke: #9aaec9; stroke-width: 1.6; }
      .blue { fill: #eff6ff; stroke: #3b6dff; stroke-width: 2; }
      .purple { fill: #f6f1ff; stroke: #8b5cff; stroke-width: 2; }
      .teal { fill: #effbf8; stroke: #008b85; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .line { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1440" height="1050" rx="14" fill="#f7f9fc"/>

  <text x="32" y="46" class="title">Same questions. Four retrieval strategies. Compare the answers.</text>
  <text x="32" y="77" class="small">AeroLex ablation study · 49 passenger-rights questions · identical generation model and grounding instructions</text>

  <g transform="translate(0,-190)">
  <text x="32" y="292" class="section">PER QUESTION · retrieve candidates, then compare four answer variations</text>
  <rect x="48" y="334" width="260" height="94" rx="13" class="box"/>
  <text x="178" y="365" text-anchor="middle" class="label">Evaluation question</text>
  <text x="178" y="391" text-anchor="middle" class="small">49 questions, one at a time</text>
  <text x="178" y="414" text-anchor="middle" class="tiny">EU questions explicitly say EU</text>
  <path d="M308 381 H358" class="flow"/>

  <rect x="358" y="322" width="1034" height="130" rx="14" class="blue"/>
  <text x="380" y="350" class="small">Retrieve 20 candidates per search, then combine the rankings with RRF</text>
  <rect x="380" y="366" width="244" height="66" rx="11" class="box"/>
  <text x="502" y="391" text-anchor="middle" class="label">Keyword / BM25</text>
  <text x="502" y="417" text-anchor="middle" class="small">top 20 candidates</text>
  <rect x="642" y="366" width="318" height="66" rx="11" class="box"/>
  <text x="801" y="391" text-anchor="middle" class="label">Dense / vector</text>
  <text x="801" y="417" text-anchor="middle" class="small">1 query embedding → top 20</text>
  <rect x="978" y="366" width="392" height="66" rx="11" class="box"/>
  <text x="1174" y="391" text-anchor="middle" class="label">RRF · fuse both ranked lists</text>
  <text x="1174" y="417" text-anchor="middle" class="small">k = 60 · keep 20 fused candidates</text>
  <path d="M875 452 V478" class="line"/>
  <path d="M192 478 H1248" class="line"/>
  <path d="M192 478 V520" class="flow"/>
  <path d="M544 478 V520" class="flow"/>
  <path d="M896 478 V520" class="flow"/>
  <path d="M1248 478 V520" class="flow"/>

  <rect x="32" y="520" width="320" height="394" rx="16" fill="#f0f5fb" stroke="#d7e1ef"/>
  <rect x="384" y="520" width="320" height="394" rx="16" fill="#f0f5fb" stroke="#d7e1ef"/>
  <rect x="736" y="520" width="320" height="394" rx="16" fill="#eef4ff" stroke="#c9d8ff"/>
  <rect x="1088" y="520" width="320" height="394" rx="16" fill="#f5f0ff" stroke="#dfd0ff"/>
  <text x="52" y="554" class="section">1 / LEXICAL ONLY</text>
  <text x="404" y="554" class="section">2 / DENSE ONLY</text>
  <text x="756" y="554" class="section">3 / RRF HYBRID</text>
  <text x="1108" y="554" class="section">4 / RRF + RERANKER</text>

  <rect x="48" y="578" width="288" height="82" rx="12" class="box"/>
  <text x="192" y="609" text-anchor="middle" class="label">BM25 ranking</text>
  <text x="192" y="637" text-anchor="middle" class="small">use the 20 lexical candidates</text>
  <rect x="400" y="578" width="288" height="82" rx="12" class="box"/>
  <text x="544" y="609" text-anchor="middle" class="label">Dense ranking</text>
  <text x="544" y="637" text-anchor="middle" class="small">use the 20 vector candidates</text>
  <rect x="752" y="578" width="288" height="82" rx="12" class="blue"/>
  <text x="896" y="609" text-anchor="middle" class="label">RRF ranking</text>
  <text x="896" y="637" text-anchor="middle" class="small">use the 20 fused candidates</text>
  <rect x="1104" y="578" width="288" height="82" rx="12" class="purple"/>
  <text x="1248" y="609" text-anchor="middle" class="label">Cross-encoder</text>
  <text x="1248" y="637" text-anchor="middle" class="small">rerank all 20 RRF candidates</text>

  <path d="M192 660 V700" class="flow"/>
  <path d="M544 660 V700" class="flow"/>
  <path d="M896 660 V700" class="flow"/>
  <path d="M1248 660 V700" class="flow"/>
  <rect x="48" y="700" width="288" height="52" rx="11" class="box"/>
  <rect x="400" y="700" width="288" height="52" rx="11" class="box"/>
  <rect x="752" y="700" width="288" height="52" rx="11" class="blue"/>
  <rect x="1104" y="700" width="288" height="52" rx="11" class="purple"/>
  <text x="192" y="733" text-anchor="middle" class="label">Top 10 lexical chunks</text>
  <text x="544" y="733" text-anchor="middle" class="label">Top 10 dense chunks</text>
  <text x="896" y="733" text-anchor="middle" class="label">Top 10 RRF chunks</text>
  <text x="1248" y="733" text-anchor="middle" class="label">Top 10 reranked chunks</text>

  <path d="M192 752 V786" class="flow"/>
  <path d="M544 752 V786" class="flow"/>
  <path d="M896 752 V786" class="flow"/>
  <path d="M1248 752 V786" class="flow"/>
  <rect x="48" y="786" width="288" height="98" rx="12" class="box"/>
  <rect x="400" y="786" width="288" height="98" rx="12" class="box"/>
  <rect x="752" y="786" width="288" height="98" rx="12" class="box"/>
  <rect x="1104" y="786" width="288" height="98" rx="12" class="box"/>
  <text x="192" y="816" text-anchor="middle" class="label">Context + Gemini</text>
  <text x="544" y="816" text-anchor="middle" class="label">Context + Gemini</text>
  <text x="896" y="816" text-anchor="middle" class="label">Context + Gemini</text>
  <text x="1248" y="816" text-anchor="middle" class="label">Context + Gemini</text>
  <text x="192" y="844" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <text x="544" y="844" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <text x="896" y="844" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <text x="1248" y="844" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <text x="192" y="868" text-anchor="middle" class="tiny">question + this arm's evidence</text>
  <text x="544" y="868" text-anchor="middle" class="tiny">question + this arm's evidence</text>
  <text x="896" y="868" text-anchor="middle" class="tiny">question + this arm's evidence</text>
  <text x="1248" y="868" text-anchor="middle" class="tiny">question + this arm's evidence</text>

  <path d="M192 884 V946" class="line"/>
  <path d="M544 884 V946" class="line"/>
  <path d="M896 884 V946" class="line"/>
  <path d="M1248 884 V946" class="line"/>
  <path d="M192 946 H1248" class="line"/>
  <path d="M720 946 V974" class="flow"/>
  <rect x="48" y="974" width="1344" height="86" rx="14" class="teal"/>
  <text x="720" y="1004" text-anchor="middle" class="label">Results CSV · one row per question · four independent answers + their ordered context chunk IDs</text>
  <text x="720" y="1034" text-anchor="middle" class="mono">lexical_answer / _chunk_ids  ·  dense_answer / _chunk_ids  ·  rrf_answer / _chunk_ids  ·  rrf_reranked_answer / _chunk_ids</text>

  <path d="M720 1060 V1090 H536 V1112" class="flow" stroke-dasharray="6 5"/>
  <rect x="48" y="1112" width="976" height="86" rx="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="536" y="1143" text-anchor="middle" class="label">Post-run qualitative review · answers checked against source text · scores 0–3</text>
  <text x="536" y="1173" text-anchor="middle" class="small">Assistant-assigned judgments, then aggregated in code · no separate Gemini judge API call</text>
  <rect x="1056" y="1112" width="336" height="86" rx="13" class="box"/>
  <text x="1224" y="1145" text-anchor="middle" class="label">49 questions → 196 answers</text>
  <text x="1224" y="1174" text-anchor="middle" class="small">1,960 saved context chunk IDs</text>
  <text x="48" y="1225" class="tiny">49 query-embedding + 196 answer-generation API calls, excluding retries · cross-encoder runs locally · no answers shared between arms</text>
  </g>
</svg>

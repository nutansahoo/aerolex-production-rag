<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">AeroLex: prepare evidence, then retrieve and answer</title>
  <desc id="desc">Build legal chunks, an in-memory BM25 index, and a persistent embedding cache. For each question, optionally rewrite a follow-up, search both indexes, fuse their rankings, rerank candidates, and generate an answer from selected passages. An optional user profile also enters the prompt. Citation tags are requested, not automatically verified.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 22px; }
      .title { font-size: 29px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; fill: #475569; }
      .small { font-size: 19px; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="650" rx="18" fill="#f8fafc"/>
  <text x="32" y="42" class="title">Prepare evidence. Retrieve a little. Answer with context.</text>
  <rect x="24" y="64" width="952" height="180" rx="14" fill="#eff6ff"/>
  <text x="44" y="96" class="label">BUILD / REFRESH · not a per-question task</text>
  <rect x="44" y="132" width="160" height="72" class="box"/>
  <text x="124" y="163" text-anchor="middle" font-weight="700">Legal PDFs</text>
  <text x="124" y="188" text-anchor="middle" class="small">EU · US · Delta</text>
  <path d="M204 168H238" class="flow"/>
  <rect x="240" y="132" width="190" height="72" class="box"/>
  <text x="335" y="163" text-anchor="middle" font-weight="700">Chunks + IDs</text>
  <text x="335" y="188" text-anchor="middle" class="small">keep legal labels</text>
  <path d="M430 168H452V140H478" class="flow"/>
  <path d="M452 168V204H478" class="flow"/>
  <rect x="480" y="114" width="200" height="52" class="box"/>
  <text x="580" y="147" text-anchor="middle">Tokenize + index</text>
  <rect x="480" y="178" width="200" height="52" class="box"/>
  <text x="580" y="211" text-anchor="middle">Embed passages</text>
  <path d="M680 140H718" class="flow"/>
  <path d="M680 204H718" class="flow"/>
  <rect x="720" y="114" width="232" height="52" class="box"/>
  <text x="836" y="137" text-anchor="middle" font-weight="700">BM25 index</text>
  <text x="836" y="157" text-anchor="middle" class="small">in memory</text>
  <rect x="720" y="178" width="232" height="52" class="box"/>
  <text x="836" y="201" text-anchor="middle" font-weight="700">Vector cache</text>
  <text x="836" y="221" text-anchor="middle" class="small">on disk → memory</text>

  <text x="44" y="282" class="label">QUERY TIME · reuse the indexes above</text>
  <rect x="44" y="326" width="160" height="72" class="box"/>
  <text x="124" y="369" text-anchor="middle" font-weight="700">Question</text>
  <path d="M204 362H238" class="flow"/>
  <rect x="240" y="326" width="190" height="72" class="box" stroke-dasharray="6 4"/>
  <text x="335" y="357" text-anchor="middle" font-weight="700">Clarify query</text>
  <text x="335" y="382" text-anchor="middle" class="small">optional history</text>
  <path d="M430 362H457" class="flow"/>
  <rect x="460" y="310" width="230" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="575" y="342" text-anchor="middle" font-weight="700">Parallel retrieval</text>
  <text x="575" y="372" text-anchor="middle">BM25 + vector</text>
  <text x="575" y="398" text-anchor="middle" class="small">two ranked lists</text>
  <path d="M690 362H738" class="flow"/>
  <rect x="740" y="326" width="212" height="72" class="box"/>
  <text x="846" y="357" text-anchor="middle" font-weight="700">RRF</text>
  <text x="846" y="382" text-anchor="middle" class="small">merge rank votes</text>
  <path d="M846 398V480" class="flow"/>
  <rect x="740" y="482" width="212" height="76" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="846" y="513" text-anchor="middle" font-weight="700">Cross-encoder</text>
  <text x="846" y="540" text-anchor="middle" class="small">refine shortlist</text>
  <path d="M740 520H682" class="flow"/>
  <rect x="420" y="482" width="260" height="76" class="box"/>
  <text x="550" y="513" text-anchor="middle" font-weight="700">Context + LLM</text>
  <text x="550" y="540" text-anchor="middle" class="small">question + evidence</text>
  <path d="M420 520H316" class="flow"/>
  <text x="368" y="503" text-anchor="middle" class="small">generate</text>
  <rect x="44" y="482" width="270" height="76" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="179" y="513" text-anchor="middle" font-weight="700">Answer + source tags</text>
  <text x="179" y="540" text-anchor="middle" class="small">not a fact-check guarantee</text>
  <path d="M550 597V560" class="flow" stroke-dasharray="5 4"/>
  <text x="550" y="618" text-anchor="middle" class="small">Optional saved user profile → prompt</text>
  <text x="44" y="642" class="small">Full-pipeline architecture; standalone demo wiring is noted in the notebook.</text>
</svg>
